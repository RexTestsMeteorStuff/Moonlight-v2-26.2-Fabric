{
"name": "Build Moon Client",
"on": ["push", "workflow_dispatch"],
"permissions": {"contents": "write"},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"name": "Find project folder", "run": "echo PROJECT_DIR=$(dirname $(find . -name build.gradle.kts | head -n 1)) >> $GITHUB_ENV"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "25"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "9.6.1"}},
{"name": "Build jar", "working-directory": "${{ env.PROJECT_DIR }}", "run": "gradle build --stacktrace --no-daemon"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "moon-client", "path": "${{ env.PROJECT_DIR }}/build/libs/", "if-no-files-found": "error"}}
]}}
}
