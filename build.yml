name: Build Moon Client

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minecraft 26.x + Loom 1.17 need Java 25 (for the Gradle daemon too)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - name: Build jar
        run: gradle build --no-daemon

      - name: Upload jar (Actions > run > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: moon-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

      # Pushing a tag like v0.1.0 also publishes the jar as a GitHub Release
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
